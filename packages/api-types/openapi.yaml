openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Athoo Home Services API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead/form submission operations
  - name: blog
    description: Blog and article operations
  - name: services
    description: Service category operations
  - name: settings
    description: App settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /leads:
    post:
      operationId: submitLead
      tags: [leads]
      summary: Submit a lead (contact/waitlist/provider form)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Lead submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSubmitResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Duplicate submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /leads/stats:
    get:
      operationId: getLeadStats
      tags: [leads]
      summary: Get lead statistics summary
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadStats"

  /blog/posts:
    get:
      operationId: getBlogPosts
      tags: [blog]
      summary: List blog posts
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of blog posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"

  /blog/posts/{slug}:
    get:
      operationId: getBlogPost
      tags: [blog]
      summary: Get a single blog post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /services:
    get:
      operationId: getServices
      tags: [services]
      summary: List all service categories
      responses:
        "200":
          description: Services list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceCategory"

  /settings/public:
    get:
      operationId: getPublicSettings
      tags: [settings]
      summary: Get public app settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettings"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LeadInput:
      type: object
      required: [formType]
      properties:
        formType:
          type: string
          enum: [contact, waitlist, provider, newsletter]
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        subject:
          type: string
        message:
          type: string
        service:
          type: string
        city:
          type: string
        experience:
          type: string
        source:
          type: string

    LeadSubmitResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        id:
          type: ["integer", "null"]

    LeadStats:
      type: object
      required: [total, newToday, byFormType, byCity]
      properties:
        total:
          type: integer
        newToday:
          type: integer
        byFormType:
          type: object
          additionalProperties:
            type: integer
        byCity:
          type: object
          additionalProperties:
            type: integer

    BlogPost:
      type: object
      required: [id, slug, title, excerpt, content, category, publishedAt, readingTimeMinutes, imageUrl]
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        excerpt:
          type: string
        content:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        publishedAt:
          type: string
        readingTimeMinutes:
          type: integer
        imageUrl:
          type: string
        metaTitle:
          type: ["string", "null"]
        metaDescription:
          type: ["string", "null"]
        author:
          type: string

    ServiceCategory:
      type: object
      required: [id, slug, name, description, icon, cities]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        cities:
          type: array
          items:
            type: string
        startingPrice:
          type: ["integer", "null"]

    PublicSettings:
      type: object
      required: [siteName, supportPhone, supportEmail, whatsappNumber]
      properties:
        siteName:
          type: string
        supportPhone:
          type: string
        supportEmail:
          type: string
        whatsappNumber:
          type: string
        socialInstagram:
          type: ["string", "null"]
        socialFacebook:
          type: ["string", "null"]
        socialTiktok:
          type: ["string", "null"]
