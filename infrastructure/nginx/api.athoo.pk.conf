# Athoo API — api.athoo.pk
# SSL/TLS terminated by Cloudflare (proxy enabled)

# API rate limit zone must live in nginx http context.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

upstream athoo_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name api.athoo.pk;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Cloudflare real IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 172.64.0.0/13;
    real_ip_header CF-Connecting-IP;

    # Rate limiting
    limit_req zone=api_limit burst=20 nodelay;

    # Max body size (for file uploads to R2)
    client_max_body_size 20M;

    location / {
        proxy_pass http://athoo_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;

        # CORS handled by Express
    }

    # Health check (no rate limit)
    location /health {
        limit_req off;
        proxy_pass http://athoo_api;
    }
}
