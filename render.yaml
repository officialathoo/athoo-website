services:
  - type: web
    name: athoo-website-api
    env: node
    rootDir: .
    plan: free
    buildCommand: pnpm install --frozen-lockfile=false && pnpm run build:api
    startCommand: pnpm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
