kind = "web"
previewPath = "/"
title = "Athoo Website"
version = "1.0.0"
id = "artifacts/athoo-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20032

[services.development]
run = "pnpm --filter @workspace/athoo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/athoo", "run", "build" ]
publicDir = "artifacts/athoo-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20032"
BASE_PATH = "/"
